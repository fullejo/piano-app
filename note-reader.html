<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&family=Noto+Music&display=swap">
<style>
  /* Layout: one big staff card the child looks at; small controls for the parent beside it. */
  :root {
    --paper: #f7f8fb; --panel: #ffffff; --ink: #1d2a44; --quiet: #5d6680; --line: #d9dce5;
    --staff: #1d2a44; --star: #f2b632; --star-soft: #f6dc9a; --good: #2f9e6b; --try: #d0603a;
    --accent: #3a6ea5; --accent-ink: #ffffff;
    --display: "Fredoka", "Nunito", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --music: "Noto Music", "Bravura", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141821; --panel: #1d2230; --ink: #eef1f7; --quiet: #a3abc0; --line: #343b4d;
      --staff: #e6e9f2; --star: #f5c04a; --star-soft: #6b5a2e; --good: #4cc08a; --try: #ef8a62;
      --accent: #6d9bd6; --accent-ink: #0f1420; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px 24px;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, [role="radio"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 16px; }
  h1 { font-family: var(--display); font-weight: 600; font-size: 28px; margin: 0; flex: 1 1 auto; letter-spacing: 0.01em; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--quiet); }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.on { background: var(--good); } .dot.err { background: var(--try); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; position: relative; min-width: 0; }
  .stars { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 34px; }
  .stars svg { width: 30px; height: 30px; }
  .slot { fill: none; stroke: var(--line); stroke-width: 2; }
  .slot.done { fill: var(--star); stroke: var(--star); }
  .slot.hinted { fill: var(--star-soft); stroke: var(--star); }
  .slot.current { stroke: var(--accent); }

  #staff { display: block; width: 100%; height: auto; max-height: 52vh; margin: 6px auto 0; }
  .staffline { stroke: var(--staff); stroke-width: 1.6; }
  .clef { fill: var(--staff); font-family: var(--music); }
  .notehead { fill: var(--ink); transition: fill 150ms; }
  .notehole { fill: var(--panel); }
  .ledger { stroke: var(--staff); stroke-width: 2; }
  #note.right .notehead { fill: var(--good); }
  #note.wrong { animation: shake 360ms ease; }
  #note.wrong .notehead { fill: var(--try); }
  .hint { font-family: var(--display); font-weight: 600; fill: var(--accent); }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @media (prefers-reduced-motion: reduce) { #note.wrong { animation: none; } }

  .message { text-align: center; font-family: var(--display); font-weight: 500; font-size: 26px; min-height: 40px; margin-top: 4px; }
  .message.good { color: var(--good); } .message.try { color: var(--try); }

  .side { display: grid; gap: 12px; align-content: start; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
  .label { font-size: 13px; font-weight: 700; color: var(--quiet); text-transform: uppercase; letter-spacing: 0.06em; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; color: var(--ink); padding: 9px 4px; border-radius: 8px; font-weight: 600; font-size: 15px; }
  .seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
  .primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 700; font-size: 18px; }
  .secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 16px; font-weight: 600; }
  .stat { display: flex; justify-content: space-between; font-size: 15px; color: var(--quiet); font-variant-numeric: tabular-nums; }
  .stat b { color: var(--ink); }

  .overlay { position: absolute; inset: 0; background: color-mix(in srgb, var(--panel) 92%, transparent); border-radius: 18px;
    display: grid; place-content: center; text-align: center; gap: 14px; padding: 24px; }
  .overlay h2 { font-family: var(--display); font-weight: 600; font-size: 34px; margin: 0; text-wrap: balance; }
  .overlay p { margin: 0; color: var(--quiet); font-size: 18px; max-width: 34ch; justify-self: center; }
</style>
</head>
<body>
<header>
  <h1>Note Reader</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Piano not connected</span></div>
</header>

<div class="layout">
  <section class="stage" aria-live="polite">
    <div class="stars" id="stars" aria-label="Progress"></div>
    <svg id="staff" viewBox="0 30 600 232" role="img" aria-label="Grand staff showing the note to play">
      <g id="lines"></g>
      <text class="clef" id="trebleClef" x="58" y="110" font-size="76">&#x1D11E;</text>
      <text class="clef" id="bassClef" x="60" y="214" font-size="76">&#x1D122;</text>
      <g id="note"></g>
    </svg>
    <div class="message" id="message"></div>

    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Read the note, play the key</h2>
      <p id="ovText">Middle C position, both hands. Ten notes. Play each one on the piano.</p>
      <div><button class="primary" id="start">Start</button></div>
    </div>
  </section>

  <aside class="side">
    <div class="box">
      <div class="label">Clef</div>
      <div class="seg" role="radiogroup" aria-label="Clef" id="clefSeg">
        <button role="radio" aria-checked="false" data-clef="treble" id="clef-treble">Treble</button>
        <button role="radio" aria-checked="false" data-clef="bass" id="clef-bass">Bass</button>
        <button role="radio" aria-checked="true" data-clef="both" id="clef-both">Both</button>
      </div>
    </div>
    <div class="box">
      <button class="secondary" id="hintBtn">Show a hint</button>
      <div class="stat">First try <b id="firstTry">0 / 0</b></div>
      <div class="stat">Best round <b id="best">–</b></div>
    </div>
    <div class="box">
      <button class="secondary" id="connect">Connect piano</button>
    </div>
  </aside>
</div>

<script>
(() => {
  // ---------- Music data: Middle C position (Piano Adventures Primer) ----------
  const TREBLE = [60, 62, 64, 65, 67];          // C4 D4 E4 F4 G4, right hand
  const BASS   = [53, 55, 57, 59, 60];          // F3 G3 A3 B3 C4, left hand
  const LETTER = {53:'F', 55:'G', 57:'A', 59:'B', 60:'C', 62:'D', 64:'E', 65:'F', 67:'G'};
  const FINGER_RH = {60:1, 62:2, 64:3, 65:4, 67:5};
  const FINGER_LH = {60:1, 59:2, 57:3, 55:4, 53:5};
  const STEP = {53:24, 55:25, 57:26, 59:27, 60:28, 62:29, 64:30, 65:31, 67:32}; // diatonic step numbers
  const NAMES = ['C','C sharp','D','E flat','E','F','F sharp','G','A flat','A','B flat','B'];
  const ROUND = 10;

  // ---------- Staff geometry ----------
  const X0 = 40, X1 = 560, GAP = 12, HALF = 6;
  const TY = 62, BY = 186;                     // top line of treble and bass staffs
  const NX = 330;                              // where the note sits
  const yTreble = s => TY + 48 - (s - 30) * HALF;   // E4 (step 30) = bottom treble line
  const yBass   = s => BY + 48 - (s - 18) * HALF;   // G2 (step 18) = bottom bass line

  const svgNS = 'http://www.w3.org/2000/svg';
  const el = (name, attrs) => { const e = document.createElementNS(svgNS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const $ = id => document.getElementById(id);

  const lines = $('lines');
  for (let i = 0; i < 5; i++) {
    lines.appendChild(el('line', {class:'staffline', x1:X0, x2:X1, y1:TY + i*GAP, y2:TY + i*GAP}));
    lines.appendChild(el('line', {class:'staffline', x1:X0, x2:X1, y1:BY + i*GAP, y2:BY + i*GAP}));
  }
  lines.appendChild(el('line', {class:'staffline', x1:X0, x2:X0, y1:TY, y2:BY + 48}));
  lines.appendChild(el('line', {class:'staffline', x1:X1, x2:X1, y1:TY, y2:BY + 48}));

  // Fit each clef glyph to its staff by measuring the glyph's ink, so it sits right in any font
  function fitClefs() {
    const ctx = document.createElement('canvas').getContext('2d');
    const fam = getComputedStyle($('trebleClef')).fontFamily;
    [['trebleClef', '\u{1D11E}', TY - 20, TY + 68], ['bassClef', '\u{1D122}', BY - 1, BY + 40]].forEach(([id, glyph, top, bottom]) => {
      ctx.font = `100px ${fam}`;
      const m = ctx.measureText(glyph);
      const h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
      if (!h) return;
      const s = (bottom - top) / h;
      const t = $(id);
      t.setAttribute('font-size', (100 * s).toFixed(2));
      t.setAttribute('y', (top + m.actualBoundingBoxAscent * s).toFixed(2));
      t.setAttribute('x', (52 + m.actualBoundingBoxLeft * s).toFixed(2));
    });
  }
  fitClefs();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('76px "Noto Music"', '\u{1D11E}\u{1D122}').then(fitClefs, fitClefs);
  }

  // ---------- State ----------
  let clefMode = 'both';
  let notes = [], idx = 0, firstTries = 0, attempts = 0, hinted = false, results = [];
  let playing = false, lockUntil = 0, shownAt = 0;
  let audio = null;

  try { const c = localStorage.getItem('nr-clef'); if (c) clefMode = c; } catch (e) {}
  const bestKey = () => 'nr-best-' + clefMode;
  const readBest = () => { try { return localStorage.getItem(bestKey()); } catch (e) { return null; } };
  const showBest = () => { const b = readBest(); $('best').textContent = b ? b + ' / ' + ROUND : '–'; };

  function setClef(mode) {
    clefMode = mode;
    try { localStorage.setItem('nr-clef', mode); } catch (e) {}
    document.querySelectorAll('#clefSeg button').forEach(b => b.setAttribute('aria-checked', b.dataset.clef === mode));
    showBest();
  }
  document.querySelectorAll('#clefSeg button').forEach(b => b.addEventListener('click', () => {
    setClef(b.dataset.clef);
    if (playing) startRound();
  }));
  setClef(clefMode);

  // ---------- Round ----------
  function makeRound() {
    const out = [];
    let prev = null;
    while (out.length < ROUND) {
      const clef = clefMode === 'both' ? (Math.random() < 0.5 ? 'treble' : 'bass') : clefMode;
      const pool = clef === 'treble' ? TREBLE : BASS;
      const midi = pool[Math.floor(Math.random() * pool.length)];
      if (prev && prev.clef === clef && prev.midi === midi) continue;
      prev = {clef, midi};
      out.push(prev);
    }
    return out;
  }

  function drawStars() {
    const box = $('stars'); box.textContent = '';
    for (let i = 0; i < ROUND; i++) {
      const s = el('svg', {viewBox:'0 0 24 24'});
      let cls = 'slot';
      if (results[i] === 'first') cls += ' done';
      else if (results[i]) cls += ' hinted';
      else if (i === idx && playing) cls += ' current';
      s.appendChild(el('path', {class:cls, d:'M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z', 'stroke-linejoin':'round'}));
      box.appendChild(s);
    }
  }

  function drawNote() {
    const g = $('note'); g.textContent = ''; g.setAttribute('class', '');
    const n = notes[idx];
    const y = n.clef === 'treble' ? yTreble(STEP[n.midi]) : yBass(STEP[n.midi]);
    // ledger line for middle C
    if (n.midi === 60) g.appendChild(el('line', {class:'ledger', x1:NX - 22, x2:NX + 22, y1:y, y2:y}));
    // whole note: filled oval with a tilted hole
    g.appendChild(el('ellipse', {class:'notehead', cx:NX, cy:y, rx:11, ry:7.5}));
    g.appendChild(el('ellipse', {class:'notehole', cx:NX, cy:y, rx:5.2, ry:3.4, transform:`rotate(-55 ${NX} ${y})`}));
    if (hinted) {
      const finger = n.clef === 'treble' ? FINGER_RH[n.midi] : FINGER_LH[n.midi];
      const hand = n.clef === 'treble' ? 'RH' : 'LH';
      const t = el('text', {class:'hint', x:NX + 34, y:y + 8, 'font-size':24});
      t.textContent = `${LETTER[n.midi]}  ·  ${hand} ${finger}`;
      g.appendChild(t);
    }
  }

  function updateStats() {
    const done = results.filter(Boolean).length;
    $('firstTry').textContent = `${firstTries} / ${done}`;
  }

  function startRound() {
    ensureAudio();
    notes = makeRound(); idx = 0; firstTries = 0; attempts = 0; hinted = false; results = [];
    playing = true; shownAt = performance.now();
    $('overlay').hidden = true;
    $('message').textContent = ''; $('message').className = 'message';
    drawStars(); drawNote(); updateStats();
    if (!midiReady) connect();
  }

  function finishRound() {
    playing = false;
    drawStars();
    $('note').textContent = '';
    const prevBest = Number(readBest() || 0);
    let line = `${firstTries} of ${ROUND} on the first try.`;
    if (firstTries > prevBest) {
      try { localStorage.setItem(bestKey(), String(firstTries)); } catch (e) {}
      if (prevBest > 0) line += ' A new best!';
    }
    showBest();
    $('ovTitle').textContent = firstTries === ROUND ? 'Perfect round!' : 'Round complete';
    $('ovText').textContent = line;
    $('start').textContent = 'Play again';
    $('overlay').hidden = false;
    $('message').textContent = '';
  }

  // ---------- Playing ----------
  function onKey(midi) {
    if (!playing || performance.now() < lockUntil) return;
    const target = notes[idx].midi;
    attempts++;
    if (midi === target) {
      results[idx] = (attempts === 1 && !hinted) ? 'first' : 'later';
      if (results[idx] === 'first') firstTries++;
      $('note').setAttribute('class', 'right');
      $('message').textContent = attempts === 1 ? 'Yes!' : 'You got it!';
      $('message').className = 'message good';
      chime();
      updateStats();
      lockUntil = performance.now() + 750;
      setTimeout(() => {
        idx++; attempts = 0; hinted = false;
        if (idx >= ROUND) { finishRound(); return; }
        $('message').textContent = ''; $('message').className = 'message';
        drawStars(); drawNote(); shownAt = performance.now();
      }, 700);
      drawStars();
    } else {
      const g = $('note');
      g.setAttribute('class', '');
      void g.getBBox();
      g.setAttribute('class', 'wrong');
      const name = NAMES[midi % 12];
      $('message').textContent = name.length > 1 ? `That was ${name}. Try again!` : `That was ${name}. Try again!`;
      $('message').className = 'message try';
      lockUntil = performance.now() + 200;
    }
  }

  $('start').addEventListener('click', startRound);
  $('hintBtn').addEventListener('click', () => { if (playing) { hinted = true; drawNote(); } });

  // ---------- Sound (a soft chime for right answers) ----------
  function ensureAudio() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
    } catch (e) { audio = null; }
  }
  function chime() {
    if (!audio) return;
    const t = audio.currentTime;
    [1318.5, 1760].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * 0.09);
      g.gain.exponentialRampToValueAtTime(0.12, t + i * 0.09 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.45);
      o.connect(g).connect(audio.destination);
      o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.5);
    });
  }

  // ---------- MIDI ----------
  let midiReady = false;
  const setStatus = (text, state) => { $('statusText').textContent = text; $('dot').className = 'dot' + (state ? ' ' + state : ''); };

  function onMessage(e) {
    const [status, d1, d2] = e.data;
    const type = status & 0xf0;
    if (type === 0x90 && d2 > 0) onKey(d1);
  }
  function hook(access) {
    const names = [];
    access.inputs.forEach(input => {
      input.onmidimessage = onMessage;
      if (input.open) input.open().catch(() => {});
      if (input.state === 'connected') names.push(input.name || 'piano');
    });
    midiReady = names.length > 0;
    if (midiReady) setStatus('Piano connected', 'on');
    else setStatus('No piano found. Check the cable, then tap Connect piano.', 'err');
  }
  async function connect() {
    if (!navigator.requestMIDIAccess) { setStatus('This browser cannot read the piano. Use Chrome.', 'err'); return; }
    try {
      const access = await navigator.requestMIDIAccess();
      hook(access);
      access.onstatechange = () => hook(access);
    } catch (err) {
      setStatus('Piano access blocked (' + err.name + '). Allow MIDI devices for this site in Chrome.', 'err');
    }
  }
  $('connect').addEventListener('click', () => { ensureAudio(); connect(); });

  // Connect quietly on load if Chrome already allowed this site
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({name: 'midi'}).then(p => { if (p.state === 'granted') connect(); }).catch(() => {});
  }

  // Quick check without a piano: number row 1-5 = right hand C D E F G, Q W E R T = left hand F G A B C
  const KEYS = {'1':60,'2':62,'3':64,'4':65,'5':67,'q':53,'w':55,'e':57,'r':59,'t':60};
  window.addEventListener('keydown', ev => { const m = KEYS[ev.key.toLowerCase()]; if (m) onKey(m); });

  drawStars();
})();
</script>
</body>
</html>
